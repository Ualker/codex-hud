name: CI

on:
  push:
    branches: [main, 74server, 'feature/**', 'integrate/**']
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 20 is the engines floor and exercises the sqlite3-CLI binding
        # fallback; 22+ exercises the built-in node:sqlite path.
        node: ['20', '22']
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install tmux and sqlite3
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux sqlite3
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: bash tests/run-suite.sh unit
      - name: Integration tests
        run: bash tests/run-suite.sh integration
