name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 20 is the engines floor and exercises the sqlite3-CLI binding
        # fallback; 22+ exercises the built-in node:sqlite path.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install tmux and sqlite3
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux sqlite3
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: bash tests/run-suite.sh unit
      - name: Integration tests
        run: bash tests/run-suite.sh integration
